<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Master – Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='22' fill='%23FFF8EC' stroke='%231F1A3D' stroke-width='8'/%3E%3Ccircle cx='38' cy='46' r='7' fill='%231F1A3D'/%3E%3Ccircle cx='62' cy='46' r='7' fill='%231F1A3D'/%3E%3Cpath d='M38 64q12 10 24 0' stroke='%231F1A3D' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/tm.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { background: #2A2350; background-image: radial-gradient(1200px 500px at 50% -10%, rgba(255,62,165,.28), transparent 70%), radial-gradient(900px 500px at 100% 40%, rgba(47,155,255,.18), transparent 70%), radial-gradient(rgba(255,255,255,.06) 2px, transparent 2.5px); background-size: auto, auto, 46px 46px; background-attachment: fixed, fixed, scroll; color: var(--ink); -webkit-user-select: auto; user-select: auto; }
  .hub { max-width: 2000px; margin: 0 auto; padding: 20px clamp(16px, 3vw, 48px) 48px; }
  .top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand canvas { width: 104px; height: 104px; flex: none; }
  .brand h1 { font: 800 clamp(44px, 5.4vw, 80px)/.85 var(--display); margin: 0; color: var(--gold); -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; filter: drop-shadow(0 7px 0 rgba(0,0,0,.35)); }
  .brand h1 small { display: block; font-size: .38em; color: #fff; -webkit-text-stroke: 8px var(--ink); letter-spacing: 4px; margin-top: 4px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls .tm-btn { font-size: 22px; padding: 11px 22px 7px; }
  .controls .tm-btn.icon { width: 56px; height: 56px; padding: 0; font-size: 28px; }
  .lead { margin: 22px 0 0; font: 700 clamp(18px, 1.6vw, 24px)/1.3 var(--word); color: rgba(255,255,255,.9); }
  .words { display: flex; align-items: center; gap: 20px; width: 100%; margin-top: 18px; padding: 14px 20px 14px 16px; text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 6px solid var(--ink); border-radius: 26px; box-shadow: 0 10px 0 rgba(0,0,0,.35); cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .words:hover, .words:focus-visible { transform: translateY(-3px); box-shadow: 0 14px 0 rgba(0,0,0,.35); outline: none; }
  .words:focus-visible { box-shadow: 0 0 0 5px var(--accent), 0 14px 0 rgba(0,0,0,.35); }
  .words .cover { flex: none; height: 96px; aspect-ratio: 341 / 480; border: 4px solid var(--ink); border-radius: 8px; background: #fff; display: flex; }
  .words .cover img { width: 100%; height: 100%; object-fit: contain; }
  .words .thumb { flex: none; height: 96px; aspect-ratio: 1; border: 4px solid var(--ink); border-radius: 14px; background: #F1EEFA; display: flex; }
  .words .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .words .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .words .k { font: 700 15px var(--word); opacity: .6; text-transform: uppercase; letter-spacing: 1.5px; }
  .words .v { font: 800 clamp(26px, 2.6vw, 38px)/1.05 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .words .m { font: 500 17px var(--word); opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .words .chg { flex: none; font: 800 24px var(--display); background: var(--accent); color: #fff; border: 4px solid var(--ink); border-radius: 999px; padding: 10px 24px 6px; text-shadow: 0 2px 0 rgba(31,26,61,.35); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(20px, 2vw, 34px); margin-top: 30px; }
  @media (min-width: 3000px) { .hub { max-width: 3300px; } .grid { grid-template-columns: repeat(6, 1fr); } }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } .brand canvas { width: 72px; height: 72px; } .words { gap: 12px; padding: 10px; } .words .cover, .words .thumb { height: 72px; } .words .m, .words .k { display: none; } .words .chg { font-size: 18px; padding: 8px 14px 4px; } .controls .tm-btn:not(.icon) { font-size: 18px; } }
  .cab { display: flex; flex-direction: column; text-decoration: none; color: var(--ink); background: var(--paper); border: 6px solid var(--ink); border-radius: 30px; overflow: hidden; box-shadow: 0 12px 0 rgba(0,0,0,.35); transition: transform .14s, box-shadow .14s; }
  .cab:hover, .cab:focus-visible { transform: translateY(-7px); box-shadow: 0 19px 0 rgba(0,0,0,.35); outline: none; }
  .cab:focus-visible { box-shadow: 0 0 0 6px var(--c), 0 19px 0 rgba(0,0,0,.35); }
  .cab:active { transform: translateY(2px); box-shadow: 0 6px 0 rgba(0,0,0,.35); }
  .cab .screen { position: relative; aspect-ratio: 16 / 9; border-bottom: 6px solid var(--ink); background: var(--c); overflow: hidden; }
  .cab .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s; }
  .cab:hover .screen img, .cab:focus-visible .screen img { transform: scale(1.05); }
  .cab .tag { position: absolute; left: 12px; top: 12px; font: 800 17px var(--display); background: #fff; border: 4px solid var(--ink); border-radius: 999px; padding: 4px 13px 1px; }
  .cab .info { padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .cab h2 { font: 800 clamp(34px, 2.6vw, 44px)/1 var(--display); margin: 0; color: var(--c); -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; }
  .cab p { margin: 0; font: 500 clamp(16px, 1.2vw, 19px)/1.4 var(--word); flex: 1; }
  .cab .like { align-self: flex-start; font: 700 14px var(--word); color: var(--ink); background: rgba(31,26,61,.09); border-radius: 999px; padding: 5px 12px; }
  .cab .like b { font-weight: 700; opacity: .6; }
  .cab .row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .cab .stars { display: flex; gap: 4px; }
  .cab .stars svg { width: 34px; height: 34px; }
  .cab .go { font: 800 24px var(--display); background: var(--c); color: #fff; border: 4px solid var(--ink); border-radius: 999px; padding: 7px 22px 3px; text-shadow: 0 2px 0 rgba(31,26,61,.4); transition: transform .12s; }
  .cab:hover .go, .cab:focus-visible .go { transform: scale(1.08); }
  .foot { margin-top: 38px; color: rgba(255,255,255,.75); font: 500 15px var(--word); text-align: center; }
  .foot a { color: #fff; }
  .linkbox { display: flex; gap: 10px; align-items: center; }
  .linkbox input { flex: 1; min-width: 0; font: 500 16px var(--word); padding: 12px 14px; border: 4px solid var(--ink); border-radius: 14px; }
  .tm-small select { font: 700 18px var(--word); padding: 8px 10px; border: 4px solid var(--ink); border-radius: 12px; background: #fff; }
  @media (prefers-reduced-motion: reduce) { .cab, .cab .screen img, .words { transition: none; } }
</style>
</head>
<body>
<div class="hub">
  <header class="top">
    <div class="brand"><canvas id="kip" width="240" height="240" aria-hidden="true"></canvas><h1>Typing Master<small>ARCADE</small></h1></div>
    <div class="controls" id="controls"></div>
  </header>
  <p class="lead">1. Choose your textbook and unit &nbsp; 2. Pick a game and type!</p>
  <button class="words" id="words" type="button" aria-label="Choose your words"></button>
  <main class="grid" id="grid" aria-label="Games"></main>
  <div class="foot">Words from <b>New Horizon 5 &amp; 6</b>, <b>Let's Try 1 &amp; 2</b> and <b>My Picture Dictionary</b>. Records are saved on this computer only.</div>
</div>
<script src="data/words.js"></script>
<script src="shared/core.js"></script>
<script src="shared/audio.js"></script>
<script src="shared/draw.js"></script>
<script src="shared/fx.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/art.js"></script>
<script src="hub.js"></script>
</body>
</html>
