<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Master – Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='22' fill='%23FFF8EC' stroke='%231F1A3D' stroke-width='8'/%3E%3Ccircle cx='38' cy='46' r='7' fill='%231F1A3D'/%3E%3Ccircle cx='62' cy='46' r='7' fill='%231F1A3D'/%3E%3Cpath d='M38 64q12 10 24 0' stroke='%231F1A3D' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/tm.css">
<style>
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { background: #2A2350; background-image: radial-gradient(rgba(255,255,255,.07) 2px, transparent 2.5px), radial-gradient(rgba(255,255,255,.04) 2px, transparent 2.5px); background-size: 46px 46px, 46px 46px; background-position: 0 0, 23px 23px; color: var(--ink); --accent: #FFC83D; }
  .hub { max-width: 1320px; margin: 0 auto; padding: 22px 22px 60px; }
  .top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand canvas { width: 120px; height: 120px; }
  .brand h1 { font: 800 clamp(48px, 7vw, 92px)/.85 var(--display); margin: 0; color: var(--gold); -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; filter: drop-shadow(0 8px 0 rgba(0,0,0,.35)); }
  .brand h1 small { display: block; font-size: .4em; color: #fff; -webkit-text-stroke: 8px var(--ink); letter-spacing: 3px; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls .tm-deckbtn { max-width: 560px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 26px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .hub { padding: 16px 16px 40px; } }
  .cab { display: flex; flex-direction: column; text-decoration: none; color: var(--ink); background: var(--paper); border: 6px solid var(--ink); border-radius: 30px; overflow: hidden; box-shadow: 0 12px 0 rgba(0,0,0,.35); transition: transform .12s, box-shadow .12s; }
  .cab:hover, .cab:focus-visible { transform: translateY(-6px) rotate(-.6deg); box-shadow: 0 18px 0 rgba(0,0,0,.35); outline: none; }
  .cab .screen { position: relative; aspect-ratio: 16/10; border-bottom: 6px solid var(--ink); background: var(--c); }
  .cab .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cab .info { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .cab h2 { font: 800 38px/1 var(--display); margin: 0; color: var(--c); -webkit-text-stroke: 8px var(--ink); paint-order: stroke fill; }
  .cab p { margin: 0; font: 500 17px/1.35 var(--word); flex: 1; }
  .cab .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .cab .stars { display: flex; gap: 4px; }
  .cab .stars svg { width: 34px; height: 34px; }
  .cab .go { font: 800 22px var(--display); background: var(--c); color: #fff; border: 4px solid var(--ink); border-radius: 999px; padding: 6px 18px 2px; text-shadow: 0 2px 0 rgba(31,26,61,.4); }
  .cab .tag { position: absolute; left: 12px; top: 12px; font: 800 16px var(--display); background: #fff; border: 4px solid var(--ink); border-radius: 999px; padding: 4px 12px 1px; }
  .foot { margin-top: 36px; color: rgba(255,255,255,.75); font: 500 15px var(--word); text-align: center; }
  .foot a { color: #fff; }
  .linkbox { display: flex; gap: 10px; align-items: center; }
  .linkbox input { flex: 1; font: 500 16px var(--word); padding: 12px 14px; border: 4px solid var(--ink); border-radius: 14px; }
  .tm-small select { font: 700 18px var(--word); padding: 8px 10px; border: 4px solid var(--ink); border-radius: 12px; background: #fff; }
</style>
</head>
<body>
<div class="hub">
  <div class="top">
    <div class="brand"><canvas id="kip" width="240" height="240"></canvas><h1>Typing<br>Master<small>ARCADE</small></h1></div>
    <div class="controls" id="controls"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">Words from <b>New Horizon 5 &amp; 6</b>, <b>Let's Try 1 &amp; 2</b> and <b>My Picture Dictionary</b>. Records are saved on this computer only.</div>
</div>
<script src="data/words.js"></script>
<script src="shared/core.js"></script>
<script src="shared/audio.js"></script>
<script src="shared/draw.js"></script>
<script src="shared/fx.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/art.js"></script>
<script src="hub.js"></script>
</body>
</html>
