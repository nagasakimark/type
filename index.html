<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Master</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='22' fill='%23FFF8EC' stroke='%231F1A3D' stroke-width='8'/%3E%3Ccircle cx='38' cy='46' r='7' fill='%231F1A3D'/%3E%3Ccircle cx='62' cy='46' r='7' fill='%231F1A3D'/%3E%3Cpath d='M38 64q12 10 24 0' stroke='%231F1A3D' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/tm.css">
<style>
  /* Home page. A flat, light "keyboard deck": white keys, one ink colour, and each game's own colour only on its key. */
  :root { --deck: #E3E7ED; --key: #fff; --mute: #4A5169; --line: rgba(21,26,44,.16); --ink: #151A2C; }
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { background: var(--deck); color: var(--ink); -webkit-user-select: auto; user-select: auto; }
  button { font: inherit; color: inherit; }
  .page { max-width: 1440px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 56px) 56px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand canvas { width: 76px; height: 76px; flex: none; }
  h1 { margin: 0; font: 700 clamp(40px, 5vw, 66px)/1 var(--word); letter-spacing: -.035em; white-space: nowrap; }
  .caret { display: inline-block; width: .08em; height: .82em; margin-left: .07em; vertical-align: -.06em; background: var(--ink); animation: caret 1s steps(1) 4 forwards; }
  @keyframes caret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .util { display: flex; gap: 4px; flex-wrap: wrap; }
  .util button { font: 700 18px var(--word); background: none; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .util button:hover { background: rgba(21,26,44,.09); }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .layout { display: grid; grid-template-columns: minmax(300px, 370px) 1fr; gap: clamp(32px, 5vw, 80px); margin-top: 30px; align-items: start; }
  .setup { position: sticky; top: 28px; display: flex; flex-direction: column; gap: 32px; }
  h2 { margin: 0 0 12px; font: 700 22px/1.2 var(--word); }
  .sub { margin: -6px 0 14px; font: 500 16px/1.5 var(--word); color: var(--mute); }

  .words { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; width: 100%; padding: 12px; text-align: left; background: var(--key); border: 0; border-radius: 16px; cursor: pointer; }
  .words:hover { box-shadow: 0 0 0 3px var(--ink); }
  .words .cover { flex: none; height: 84px; aspect-ratio: 341 / 480; border-radius: 6px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--line); display: flex; }
  .words .thumb { flex: none; height: 84px; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #F1F3F7; box-shadow: 0 0 0 1px var(--line); display: flex; }
  .words img { width: 100%; height: 100%; object-fit: contain; }
  .words .txt { flex: 1 1 120px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .words .v { font: 700 22px/1.2 var(--word); overflow-wrap: anywhere; }
  .words .m { font: 500 15px/1.4 var(--word); color: var(--mute); }
  .words .chg { flex: 1 1 100%; text-align: center; font: 700 17px var(--word); background: var(--ink); color: #fff; border-radius: 10px; padding: 10px 14px; }

  .mode { display: flex; flex-direction: column; gap: 8px; }
  .mode button { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 16px; background: none; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; }
  .mode button b { font: 700 19px/1.3 var(--word); }
  .mode button span { font: 500 15px/1.4 var(--word); color: var(--mute); }
  .mode button:hover { border-color: var(--ink); }
  .mode button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .mode button.on span { color: rgba(255,255,255,.78); }

  .games { display: flex; flex-direction: column; gap: 8px; }
  .game { display: grid; grid-template-columns: 64px 176px minmax(0, 1fr) auto; align-items: center; gap: 22px; padding: 8px 22px 8px 14px; border-radius: 20px; color: inherit; text-decoration: none; transition: background .12s; }
  .game:hover, .game:focus-visible { background: var(--key); outline-offset: 0; }
  .game:focus-visible { outline: 3px solid var(--ink); }
  .key { width: 64px; height: 64px; border-radius: 14px; background: var(--c); color: var(--ink); font: 700 34px/64px var(--word); text-align: center; box-shadow: 0 6px 0 rgba(21,26,44,.45); transition: transform .08s, box-shadow .08s; }
  .game:hover .key, .game:focus-visible .key { transform: translateY(-2px); box-shadow: 0 8px 0 rgba(21,26,44,.45); }
  .game:active .key, .game.down .key { transform: translateY(5px); box-shadow: 0 1px 0 rgba(21,26,44,.45); }
  .shot { aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--c); box-shadow: 0 0 0 1px var(--line); }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .game h3 { margin: 0 0 4px; font: 700 26px/1.15 var(--word); letter-spacing: -.01em; }
  .game h3 small { margin-left: 10px; font: 500 15px var(--word); letter-spacing: 0; color: var(--mute); }
  .game p { margin: 0; font: 500 16px/1.5 var(--word); color: var(--mute); }
  .stars { display: flex; gap: 3px; }
  .stars svg { width: 24px; height: 24px; }

  .foot { margin-top: 44px; font: 500 14px/1.5 var(--word); color: var(--mute); }

  .linkbox { display: flex; gap: 10px; align-items: center; }
  .linkbox input { flex: 1; min-width: 0; font: 500 16px var(--word); padding: 12px 14px; border: 4px solid var(--ink); border-radius: 14px; }
  .tm-small select { font: 700 18px var(--word); padding: 8px 10px; border: 4px solid var(--ink); border-radius: 12px; background: #fff; }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; margin-top: 32px; }
    .setup { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  }
  @media (max-width: 720px) {
    .setup { grid-template-columns: 1fr; }
    .brand canvas { width: 56px; height: 56px; }
    .game { grid-template-columns: 56px minmax(0, 1fr); gap: 4px 16px; padding: 10px 10px 14px; align-items: start; }
    .key { width: 56px; height: 56px; font-size: 30px; line-height: 56px; }
    .shot { display: none; }
    .game .txt { grid-column: 2; }
    .game .stars { grid-column: 2; }
    .words { flex-wrap: nowrap; }
    .words .chg { flex: none; padding: 8px 14px; }
    .game h3 small { display: block; margin: 2px 0 0; }
    .words .m { display: none; }
    .words .cover, .words .thumb { height: 64px; }
  }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } .key, .game { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand"><canvas id="kip" width="240" height="240" aria-hidden="true"></canvas><h1 id="title" aria-label="Typing Master"><span id="typed" aria-hidden="true">Typing Master</span><span class="caret" id="caret" aria-hidden="true"></span></h1></div>
    <nav class="util" id="controls" aria-label="メニュー"></nav>
  </header>
  <div class="layout">
    <section class="setup" aria-label="せってい">
      <div><h2>たんご</h2><button class="words" id="words" type="button" aria-label="たんごを えらぶ"></button></div>
      <div><h2>あそびかた</h2><div class="mode" id="mode" role="group" aria-label="あそびかた"></div></div>
    </section>
    <main>
      <h2>ゲーム</h2>
      <p class="sub">キーボードで ゲームの もじを おしても はじまるよ。</p>
      <div class="games" id="grid"></div>
      <div class="foot">きろくは この コンピューターに だけ ほぞんされます。</div>
    </main>
  </div>
</div>
<script src="data/words.js"></script>
<script src="shared/core.js"></script>
<script src="shared/coach.js"></script>
<script src="shared/vendor/qrcode-generator.js"></script>
<script src="shared/audio.js"></script>
<script src="shared/draw.js"></script>
<script src="shared/fx.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/art.js"></script>
<script src="hub.js"></script>
</body>
</html>
