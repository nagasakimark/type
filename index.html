<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing Master</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='22' fill='%23FFF8EC' stroke='%231F1A3D' stroke-width='8'/%3E%3Ccircle cx='38' cy='46' r='7' fill='%231F1A3D'/%3E%3Ccircle cx='62' cy='46' r='7' fill='%231F1A3D'/%3E%3Cpath d='M38 64q12 10 24 0' stroke='%231F1A3D' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/tm.css">
<style>
  /* Home page: deep ocean blue, white type, a yellow keycap mascot, and the games' own screenshots for colour. */
  :root { --board: #0E2740; --board2: #17395A; --panel: #153454; --chalk: #F2F5F8; --dust: #9DB4CC; --line: rgba(242,245,248,.2); --star: #F2C14E; }
  html, body { overflow: auto; height: auto; min-height: 100%; }
  body { background: var(--board); color: var(--chalk); -webkit-user-select: auto; user-select: auto; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; }
  .page { max-width: 1600px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 56px) 56px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 18px; }
  #mascot { width: clamp(88px, 9vw, 128px); height: auto; flex: none; overflow: visible; }
  #mascot .eyes { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  #mascot .paw { transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  h1 { margin: 0; font: 700 clamp(40px, 5vw, 66px)/1.05 var(--word); letter-spacing: -.035em; white-space: nowrap; }
  .caret { display: inline-block; width: .08em; height: .8em; margin-left: .07em; vertical-align: -.05em; background: var(--chalk); animation: caret 1s steps(1) 4 forwards; }
  @keyframes caret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .util { display: flex; gap: 4px; flex-wrap: wrap; }
  .util button { font: 700 18px var(--word); background: none; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; color: var(--dust); }
  .util button:hover { background: rgba(238,241,232,.1); color: var(--chalk); }

  .setup { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 40px; margin-top: 26px; padding: 14px 16px; background: var(--board2); border-radius: 16px; }
  .words { display: flex; align-items: center; gap: 14px; min-width: 0; padding: 0; background: none; border: 0; text-align: left; cursor: pointer; border-radius: 12px; }
  .words .cover { flex: none; height: 72px; aspect-ratio: 341 / 480; border-radius: 5px; overflow: hidden; background: #fff; display: flex; }
  .words .thumb { flex: none; height: 72px; aspect-ratio: 1; border-radius: 9px; overflow: hidden; background: #F1F3F7; display: flex; }
  .words img { width: 100%; height: 100%; object-fit: contain; }
  .words .txt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .words .v { font: 700 24px/1.2 var(--word); overflow-wrap: anywhere; }
  .words .m { font: 500 15px/1.4 var(--word); color: var(--dust); }
  .words .chg { flex: none; font: 700 16px var(--word); color: var(--board); background: #FFD23F; border-radius: 10px; padding: 9px 16px; margin-left: 6px; }
  .words:hover .chg { background: #FFE27A; }
  .mode { display: flex; gap: 6px; }
  .mode button { display: flex; flex-direction: column; gap: 1px; text-align: left; padding: 9px 16px; background: none; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
  .mode button b { font: 700 18px/1.3 var(--word); }
  .mode button span { font: 500 14px/1.4 var(--word); color: var(--dust); }
  .mode button:hover { border-color: var(--chalk); }
  .mode button.on { background: var(--chalk); border-color: var(--chalk); color: var(--board); }
  .mode button.on span { color: #3B5068; }

  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: clamp(18px, 2vw, 28px); margin-top: 30px; }
  .game { display: block; color: inherit; text-decoration: none; padding: 12px 12px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; transition: opacity .15s, background .15s, border-color .15s; }
  .game:hover, .game:focus-visible { background: var(--board2); border-color: rgba(242,245,248,.5); }
  .games:hover .game:not(:hover) { opacity: .5; }
  .shot { display: block; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--board2); }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .game:hover .shot img, .game:focus-visible .shot img { transform: scale(1.04); }
  .game:focus-visible { outline-offset: 3px; }
  .meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 14px 6px 0; }
  .game h3 { margin: 0; font: 700 clamp(24px, 1.9vw, 30px)/1.15 var(--word); letter-spacing: -.01em; }
  .stars { display: flex; gap: 2px; flex: none; align-self: center; }
  .stars svg { width: 20px; height: 20px; }
  .game p { margin: 5px 6px 0; font: 500 16px/1.5 var(--word); color: var(--dust); max-width: 46ch; }
  .foot { margin-top: 48px; font: 500 14px/1.5 var(--word); color: var(--dust); }

  .linkbox { display: flex; gap: 10px; align-items: center; }
  .linkbox input { flex: 1; min-width: 0; font: 500 16px var(--word); padding: 12px 14px; border: 4px solid #1F1A3D; border-radius: 14px; }
  .tm-small select { font: 700 18px var(--word); padding: 8px 10px; border: 4px solid #1F1A3D; border-radius: 12px; background: #fff; }

  @media (max-width: 720px) {
    h1 { font-size: 32px; }
    #mascot { width: 66px; }
    .brand { gap: 12px; }
    .setup { gap: 16px; }
    .words .cover, .words .thumb { height: 56px; }
    .words .m { display: none; }
    .mode { width: 100%; flex-direction: column; }
    .games:hover .game:not(:hover) { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } .game, .shot img { transition: none; } .game:hover .shot img { transform: none; } }
</style>
</head>
<body>

        <g class="paw" id="pawL"><ellipse cx="49" cy="88" rx="12" ry="8" fill="#FFA94D" stroke="#0B1B2E" stroke-width="3"/><path d="M45 84v4M49 83.5v4.5M53 84v4" stroke="#0B1B2E" stroke-width="1.6" stroke-linecap="round"/></g>

      </svg>
      <h1 id="title" aria-label="Typing Master"><span id="typed" aria-hidden="true">Typing Master</span><span class="caret" id="caret" aria-hidden="true"></span></h1>

    <nav class="util" id="controls" aria-label="メニュー"></nav>
  </header>
  <section class="setup" aria-label="せってい">
    <button class="words" id="words" type="button" aria-label="たんごを えらぶ"></button>
