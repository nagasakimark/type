<style>body{margin:0}</style><script src="../../shared/vendor/three.bundle.js"></script><script src="../track.js"></script><script src="../world.js"></script><body><script>
(async()=>{TT.MODEL_BASE='../../assets/kenney/turbo-type/models/';await TT.Models.load();
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(800,400);document.body.append(R.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0xcfe6f7);sc.add(new THREE.HemisphereLight(0xffffff,0x888888,2));
const m=TT.Models.get('grandStand');const g=new THREE.Group();for(const p of m.parts){g.add(new THREE.Mesh(p.geo,p.mat))}sc.add(g);
// grid markers z along -0.5..0.5 each 0.1 as small boxes colored by z, at y=0.95
for(let i=0;i<=10;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.03,0.03),new THREE.MeshBasicMaterial({color:i<5?0xff0000:0x0000ff}));b.position.set(-0.55,1.0,-0.5+i*0.1);sc.add(b);}
const cam=new THREE.OrthographicCamera(-1.2*2,1.2*2,1.2,-0.6,0.1,50);cam.position.set(-5,0.5,0);cam.lookAt(0,0.5,0);R.render(sc,cam);
const cam2=new THREE.PerspectiveCamera(40,2,0.1,50);window.done=1})();
</script>
